<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYC Soundscape — A Day in the Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<header>
  <div class="header-editorial">
    <div class="header-title">A Day in the Life of New York</div>
    <div class="header-sub">NYC Soundscape &middot; 62,022 recordings</div>
  </div>
  <button class="header-play-btn" id="play-btn">▶ Play the Day</button>
</header>

<div class="app">

  <!-- LEFT: PERSONAS -->
  <div class="panel-left">
    <div class="panel-label">Select a New Yorker</div>
    <div id="persona-list"></div>
  </div>

  <!-- CENTER: CLOCK + TIMELINE -->
  <div class="clock-panel">
    <div class="clock-time-bar" id="clock-time-bar"></div>
    <svg id="clock-svg" viewBox="-260 -260 520 520"></svg>
    <div class="hour-tooltip" id="hour-tooltip">
      <div class="hour-tooltip-title" id="tt-title"></div>
      <div id="tt-sounds"></div>
      <div id="tt-desc"></div>
    </div>
    <div class="timeline-wrapper">
      <div class="timeline-strip" id="timeline-strip"></div>
      <div class="timeline-time-labels">
        <span>12AM</span><span>6AM</span><span>12PM</span><span>6PM</span><span>12AM</span>
        <span class="timeline-kb-hint">← →</span>
      </div>
    </div>
  </div>

  <!-- RIGHT: MAP + STORY LOG -->
  <div class="map-area">
    <div id="map"></div>
    <div id="story-overlay">
      <div id="journey-desc-text"></div>
    </div>
  </div>

  <!-- BOTTOM STRIP -->
  <!-- keep journey-info in DOM (used by updateHour) but hidden -->
  <div hidden>
    <div id="journey-info">
      <div id="journey-hour-text"></div>
      <div id="journey-location-text"></div>
    </div>
  </div>

  <div class="info-strip">

    <!-- Col 1: spectrograph (waveform + dB overlay) -->
    <div class="info-col info-col-spec">
      <div class="spec-wrapper">
        <canvas id="waveform-canvas"></canvas>
        <div class="spec-db-overlay">
          <span class="meter-db-value" id="db-value">0</span>
          <span class="meter-db-unit">dB</span>
        </div>
      </div>
    </div>

    <!-- Col 3: sounds this hour -->
    <div class="info-col info-col-sounds">
      <div class="panel-label">Sounds This Hour</div>
      <div class="sounds-list" id="sounds-list">
        <div class="sounds-empty">Select a persona &amp; hour to explore sounds.</div>
      </div>
    </div>

  </div>

</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
